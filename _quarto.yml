project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - entreprises.qmd
    - comprendre.qmd
    - risques.qmd
    - methodologie.qmd
    - perimetre.qmd
    - cercle1-international.qmd
    - cercle1-profils.qmd
  resources:
    - data/**
    - scripts/**
    - styles/**
    - sources/**
    - assets/**

website:
  title: "BITD France"
  favicon: assets/favicon.png
  navbar:
    left:
      - href: index.qmd
        text: Vue d'ensemble
      - href: entreprises.qmd
        text: Entreprises
      - href: comprendre.qmd
        text: Comprendre les données
      - href: methodologie.qmd
        text: Méthodologie & sources
      - href: perimetre.qmd
        text: Périmètre & sélection
      - text: "Entreprises du Cercle 1"
        menu:
          - text: "International & coopérations"
            href: cercle1-international.qmd
          - text: "Fiches groupes"
            href: cercle1-profils.qmd
          - text: "Méthode & sources"
            href: cercle1-international.qmd#methodologie-cercle1
    right:
      - text: Situation au 12 août 2026
  page-footer:
    left: "<span class='footer-signature'>BITD France · Données issues de sources publiques</span>"
    right: "<span class='footer-signature'>Le panel ne constitue ni un classement officiel, ni une liste exhaustive de la BITD française. La méthode de sélection est détaillée dans <a href='methodologie.html#constitution-du-panel'>Méthodologie &amp; sources</a>.</span>"
  reader-mode: false
  page-navigation: true

format:
  html:
    theme:
      - cosmo
      - styles/dashboard.scss
    toc: false
    smooth-scroll: true
    anchor-sections: true
    include-in-header:
      - text: |
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Inter:wght@300;400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      - text: |
          <script src="scripts/glossary.js?v=20260813b" defer></script>
          <script src="scripts/provenance.js?v=20260814b" defer></script>
          <script src="scripts/dashboard.js?v=20260813b" defer></script>
          <script src="scripts/identite.js?v=20260813b" defer></script>
          <script src="scripts/panel-methodology.js?v=20260814a" defer></script>
          <script src="scripts/filters.js?v=20260813b" defer></script>
          <script src="scripts/programme.js?v=20260813b" defer></script>
          <script src="scripts/map.js?v=20260813b" defer></script>
          <script src="scripts/map-legend-mobile.js?v=20260814a" defer></script>
          <script src="scripts/table.js?v=20260813b" defer></script>
          <script src="scripts/comprendre.js?v=20260813b" defer></script>
          <script src="scripts/methodologie.js?v=20260814b" defer></script>
